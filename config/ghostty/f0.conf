# Ghostty config of f0.app. install.sh writes it to ~/.config/f0/ghostty.conf, filling
# in the paths between @ signs; f0.app reads only that file, so your own Ghostty config
# does not apply here and this one does not apply to your Ghostty. Run install.sh again
# to rewrite it.

title = f0
macos-icon = custom
macos-custom-icon = @F0_ICON@

# Every window opens the f0 launcher through your login shell, so PATH has Homebrew,
# Cargo and the rest even when Finder opened the app. There is no plain shell: quitting
# the launcher with `q` closes the window, and when the launcher fails to start, the
# window stays until Enter so the error can be read, then closes. Ghostty runs this line
# as `exec -l <command>`, so /bin/sh comes first to run the fallback; the login shell
# gets a single command that reads the same in zsh, bash and fish.
command = /bin/sh -c '"${SHELL:-/bin/zsh}" -l -c "\"$0\" launch" || { echo; echo "f0 stopped with an error. Press Enter to close."; read _; }' '@F0_BIN@'

# tmux keeps the sessions, so a window can close without asking or restoring.
window-save-state = never
quit-after-last-window-closed = true
confirm-close-surface = false
# This app is a frozen copy of Ghostty; install.sh updates it.
auto-update = off

# The theme follows the macOS appearance and matches the tmux and Neovim configs. The
# paths point into the f0 repo, so the app finds its themes even with --no-ghostty.
theme = light:@F0_THEMES@/f0-light,dark:@F0_THEMES@/f0-dark
# The title sits on the window color instead of a bar of another shade.
macos-titlebar-style = transparent
font-family = JetBrainsMono Nerd Font
font-size = 14
window-padding-x = 12
window-padding-y = 8
window-padding-balance = true
window-padding-color = extend
macos-option-as-alt = true
shell-integration-features = no-cursor

# Panes belong to tmux: Ghostty splits would sit outside the f0 session, and its
# clear would wipe every pane at once. Cmd-k sends the tmux prefix plus Ctrl-l, so it
# clears only the focused pane.
keybind = super+d=ignore
keybind = super+shift+d=ignore
keybind = super+k=text:\x01\x0c
