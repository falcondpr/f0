# f0 tmux config

set -g prefix C-a
unbind C-b
bind C-a send-prefix

set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-ghostty:RGB,xterm-256color:RGB"
# Keys like Ctrl-Shift-x and Ctrl-Enter reach Neovim and the agent: tmux reads them from
# the terminal in the CSI u format and passes them on to the programs that ask for them.
set -s extended-keys on
set -s extended-keys-format csi-u
set -as terminal-features ",xterm-ghostty:extkeys,xterm-256color:extkeys"
set -g mouse on
set -g history-limit 50000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Neovim: no delay on Esc, and focus events so it reloads files edited by the agent.
set -sg escape-time 10
set -g focus-events on

# The f0 palette, the same as Ghostty and Neovim: neutral greys and one blue accent.
# tmux uses the set of the current theme. The names are tmux's, the roles are ours:
# black is the panel shade, dark grey the selection, light grey the muted text, white
# the text and yellow the one accent (blue).
set -g theme detect
set -g dark-theme-black "#181818"
set -g dark-theme-dark-grey "#2a2d3a"
set -g dark-theme-light-grey "#8b8b8b"
set -g dark-theme-white "#d4d4d4"
set -g dark-theme-yellow "#4daafc"
set -g dark-theme-red "#f14c4c"
set -g dark-theme-green "#8cc265"
set -g dark-theme-blue "#4daafc"
set -g dark-theme-cyan "#4ec9b0"
set -g dark-theme-magenta "#c586c0"
set -g light-theme-black "#f8f8f8"
set -g light-theme-dark-grey "#e4e6f1"
set -g light-theme-light-grey "#6e6e6e"
set -g light-theme-white "#1f1f1f"
set -g light-theme-yellow "#005fb8"
set -g light-theme-red "#c72e2e"
set -g light-theme-green "#3d7a1f"
set -g light-theme-blue "#005fb8"
set -g light-theme-cyan "#0f7a8a"
set -g light-theme-magenta "#af00db"

# appearance.sh follows the macOS appearance: it sets the theme and paints the panes,
# so shells and the agent match the editor whatever colours the terminal has. Not
# every terminal tells tmux when the appearance changes, so it runs on attach, on
# focus and with the status line, and only writes when the appearance changed.
set -g status-interval 5
set -gu @f0-appearance
run-shell "~/.config/tmux/appearance.sh"
set-hook -g client-attached 'run-shell -b "~/.config/tmux/appearance.sh"'
set-hook -g client-focus-in 'run-shell -b "~/.config/tmux/appearance.sh"'

# Panes are told apart by the panel shade, not by lines: borders are blank cells in
# that shade. Pane titles are set by f0 (editor, agent, server names) in uppercase,
# since tmux has no format for it, and are muted; the active one is in the text
# color, underlined in the accent.
set -g pane-border-status top
set -g pane-border-lines spaces
set -g pane-border-style "fg=themelightgrey,bg=themeblack"
set -g pane-active-border-style "fg=themewhite,bg=themeblack"
set -g pane-border-format " #{?pane_active,#[underscore us=themeyellow],}#{pane_title}#[nounderscore] "
set -g allow-rename off
set -g set-titles on
set -g set-titles-string "#S"

set -g status-position bottom
set -g status-style "fg=themelightgrey,bg=themeblack"
set -g status-left-length 40
set -g status-left " #[fg=themeyellow]#S#[default]  "
# Window names only once a session has more than the one f0 creates.
set -g window-status-format "#{?#{==:#{session_windows},1},,#I #W}"
set -g window-status-current-format "#{?#{==:#{session_windows},1},,#[fg=themewhite]#I #W}"
# The path from the end, with ~ for the home folder. The job prints nothing.
set -g status-right "#{=/-40/…:#{s|^$HOME|~|:pane_current_path}} #(~/.config/tmux/appearance.sh)"

set -g message-style "fg=themewhite,bg=themeblack"
set -g message-command-style "fg=themewhite,bg=themeblack"
set -g mode-style "fg=themewhite,bg=themedarkgrey"
set -g menu-style "fg=themewhite,bg=themeblack"
set -g menu-selected-style "fg=themeyellow,bg=themedarkgrey"
set -g menu-border-style "fg=themelightgrey,bg=themeblack"
set -g menu-border-lines rounded
set -g popup-style "fg=themewhite,bg=themeblack"
set -g popup-border-style "fg=themelightgrey,bg=themeblack"
set -g popup-border-lines rounded

bind r source-file ~/.config/tmux/tmux.conf \; display "tmux config reloaded"
bind s choose-tree -Zs
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Ctrl-h/j/k/l moves between nvim splits and tmux panes (pairs with vim-tmux-navigator).
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?|fzf)(diff)?$'"
bind -n C-h if-shell "$is_vim" "send-keys C-h" "select-pane -L"
bind -n C-j if-shell "$is_vim" "send-keys C-j" "select-pane -D"
bind -n C-k if-shell "$is_vim" "send-keys C-k" "select-pane -U"
bind -n C-l if-shell "$is_vim" "send-keys C-l" "select-pane -R"
bind -T copy-mode-vi C-h select-pane -L
bind -T copy-mode-vi C-j select-pane -D
bind -T copy-mode-vi C-k select-pane -U
bind -T copy-mode-vi C-l select-pane -R

# Ctrl-d would quit the agent and leave a plain shell in its pane. It still reaches
# that shell once the agent is gone, so leaving the shell brings the agent back.
bind -n C-d if -F "#{&&:#{@f0_agent},#{!=:#{pane_current_command},#{b:default-shell}}}" \
  "display-message 'Ctrl-d is off in the agent pane'" \
  "send-keys C-d"

# The plain keys are taken by navigation; prefix + key sends them to the pane.
bind C-l send-keys C-l
bind C-k send-keys C-k

setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"
