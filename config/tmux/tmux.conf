# f0 tmux config

set -g prefix C-a
unbind C-b
bind C-a send-prefix

set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-ghostty:RGB,xterm-256color:RGB"
set -g mouse on
set -g history-limit 50000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Neovim: no delay on Esc, and focus events so it reloads files edited by the agent.
set -sg escape-time 10
set -g focus-events on

# Pane titles are set by f0 (editor, agent, server names).
set -g pane-border-status top
set -g pane-border-format " #{?pane_active,#[bold],}#{pane_title} "
set -g allow-rename off
set -g set-titles on
set -g set-titles-string "#S"

set -g status-position bottom
set -g status-left-length 40
set -g status-left "#[bold] #S #[default] "
set -g status-right "#{=40:pane_current_path} "

bind r source-file ~/.config/tmux/tmux.conf \; display "tmux config reloaded"
bind s choose-tree -Zs
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Ctrl-h/j/k/l moves between nvim splits and tmux panes (pairs with vim-tmux-navigator).
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?|fzf)(diff)?$'"
bind -n C-h if-shell "$is_vim" "send-keys C-h" "select-pane -L"
bind -n C-j if-shell "$is_vim" "send-keys C-j" "select-pane -D"
bind -n C-k if-shell "$is_vim" "send-keys C-k" "select-pane -U"
bind -n C-l if-shell "$is_vim" "send-keys C-l" "select-pane -R"
bind -T copy-mode-vi C-h select-pane -L
bind -T copy-mode-vi C-j select-pane -D
bind -T copy-mode-vi C-k select-pane -U
bind -T copy-mode-vi C-l select-pane -R

# The plain keys are taken by navigation; prefix + key sends them to the pane.
bind C-l send-keys C-l
bind C-k send-keys C-k

setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"
